# fleet.yaml: who your agents are and where they live.
#
# `./fleet setup` writes this file for you. Edit it by hand any time, then run
# `./fleet up` to apply. Secrets (bot tokens) never go here; they live in .env.

owner:
  name: Sam
  # IANA timezone, used for heartbeats, quiet hours and the warden schedule.
  timezone: Europe/London

# AI subscriptions you sign in to. No API keys, no per-token billing.
#   claude    Claude Pro or Max      → `./fleet login claude`
#   chatgpt   ChatGPT Plus or Pro    → `./fleet login chatgpt`
# Agents fall back across these when one hits its usage limit.
subscriptions: [claude, chatgpt]

# Each agent runs on one harness and talks on one or more chat platforms.
#
#   harness   openclaw | hermes
#   role      ops | builder | assistant | researcher | custom
#             (picks the starter persona from templates/roles/<role>.md)
#   model     optional override, e.g. anthropic/claude-opus-4-8 or
#             openai/gpt-5.6-sol. Defaults come from your subscriptions.
#   channels  any of: discord, telegram, whatsapp
#
# Each agent with a chat channel needs its own bot. Tokens are read from .env:
#   discord   DISCORD_TOKEN_<ID>     (e.g. DISCORD_TOKEN_OPS)
#   telegram  TELEGRAM_TOKEN_<ID>    (e.g. TELEGRAM_TOKEN_ASSISTANT)
#   whatsapp  no token: pair once with `./fleet whatsapp <id>` (QR code)
#
# WhatsApp links a real phone number, so give it to one agent per harness.
agents:
  - id: ops
    name: Ops
    harness: openclaw
    role: ops
    channels: [discord]

  - id: builder
    name: Builder
    harness: openclaw
    role: builder
    channels: [discord]

  - id: assistant
    name: Assistant
    harness: hermes
    role: assistant
    channels: [telegram]

defaults:
  # How often OpenClaw agents wake to check HEARTBEAT.md. "0m" turns it off.
  heartbeat: 1h
  # Agents stay quiet outside these hours unless something is urgent.
  active_hours: { start: "08:00", end: "22:00" }

memory:
  # Shared long-term memory across every agent (engram + gbrain on Postgres).
  enabled: true

warden:
  # session-warden: rotates bloated sessions, guards rate limits, runs nightly
  # reflection and weekly reviews. Turn off to run the agents bare.
  enabled: true
